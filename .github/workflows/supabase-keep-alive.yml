name: Supabase keep-alive

on:
  schedule:
    # Roda segunda e quinta às 09:00 (horário de Brasília = 12:00 UTC)
    - cron: "0 12 * * 1,4"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Falha no ping ao Supabase"
            exit 1
          fi

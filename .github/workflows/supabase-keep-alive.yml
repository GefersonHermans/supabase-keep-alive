name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 * * *"   # todo dia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escrita leve no banco
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"ultimo_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "HTTP $status"
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "Falha no ping ao Supabase"
            exit 1
          fi
